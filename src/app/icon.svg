<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="portalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004ac6"/>
      <stop offset="50%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#712ae2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Rounded Base Badge -->
  <rect width="64" height="64" rx="16" fill="url(#portalGrad)"/>
  
  <!-- Graduation Cap Underneath Skullcap -->
  <path d="M19 32v7c0 5 26 5 26 0v-7c-3.5 2.5-8.5 4-13 4s-9.5-1.5-13-4z" fill="#dbe1ff"/>
  
  <!-- Mortarboard Diamond Top -->
  <polygon points="32 14 54 25 32 36 10 25" fill="#ffffff"/>
  
  <!-- Golden Tassel & Cord -->
  <circle cx="32" cy="25" r="2.5" fill="url(#goldGrad)"/>
  <path d="M32 25 Q45 28 46 38" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <rect x="43.5" y="38" width="5" height="7" rx="1.5" fill="url(#goldGrad)"/>
</svg>
