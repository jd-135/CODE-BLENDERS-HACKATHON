<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1050" width="800" height="1050" style="background:#fff;font-family:'Segoe UI',Roboto,sans-serif;">
  <rect width="800" height="1050" fill="#fffdfb"/>
  <rect x="25" y="25" width="750" height="1000" fill="#ffffff" stroke="#712ae2" stroke-width="2.5" rx="8"/>
  <rect x="35" y="35" width="730" height="980" fill="none" stroke="#d4af37" stroke-width="1.2" stroke-dasharray="6 3"/>

  <!-- Watermark -->
  <text x="400" y="550" fill="rgba(113,42,226,0.03)" font-size="75" font-weight="900" text-anchor="middle" transform="rotate(-30 400 550)">OBC CENTRAL LIST</text>

  <!-- Header -->
  <g transform="translate(400, 75)" text-anchor="middle">
    <circle cx="0" cy="0" r="28" fill="#f6f0ff" stroke="#712ae2" stroke-width="2"/>
    <text y="6" font-size="18" fill="#712ae2" font-weight="bold">🏛️</text>
    <text y="48" font-size="20" font-weight="bold" fill="#2c1452" letter-spacing="1">GOVERNMENT OF TAMIL NADU</text>
    <text y="70" font-size="13" font-weight="bold" fill="#712ae2">REVENUE DEPARTMENT • REVENUE DIVISIONAL OFFICE</text>
    <text y="88" font-size="10" fill="#666">CERTIFICATE FOR OTHER BACKWARD CLASSES (OBC - NON-CREAMY LAYER)</text>
  </g>

  <line x1="50" y1="180" x2="750" y2="180" stroke="#712ae2" stroke-width="1.5"/>

  <!-- Identifier Box -->
  <rect x="50" y="195" width="700" height="45" fill="#f8f4ff" rx="6" stroke="#e6d9ff" stroke-width="1"/>
  <text x="70" y="222" font-size="11" font-weight="bold" fill="#555">CERTIFICATE NO:</text>
  <text x="185" y="222" font-size="13" font-weight="bold" fill="#712ae2" font-family="monospace">TN-COMM/2026/088219</text>
  <text x="460" y="222" font-size="11" font-weight="bold" fill="#555">CENTRAL OBC REGISTRY SL NO:</text>
  <text x="650" y="222" font-size="12" font-weight="bold" fill="#222">Item No. 42</text>

  <!-- Title -->
  <g transform="translate(400, 285)" text-anchor="middle">
    <text font-size="22" font-weight="bold" fill="#2c1452" text-decoration="underline">COMMUNITY &amp; CASTE CERTIFICATE</text>
    <text y="22" font-size="11" font-weight="bold" fill="#712ae2">OTHER BACKWARD CLASS (NON-CREAMY LAYER CATEGORY)</text>
  </g>

  <!-- Body Text -->
  <g font-size="14" fill="#222">
    <text x="80" y="345">This is to certify that <tspan font-weight="bold" fill="#712ae2">PRIYA SHARMA</tspan>, daughter of Thiru <tspan font-weight="bold">Ramesh Sharma</tspan>,</text>
    <text x="60" y="375">of Village/Town Chennai North in the State of Tamil Nadu, belongs to the</text>
    <text x="60" y="405"><tspan font-weight="bold" font-size="16" fill="#131b2e">Backward Class (BC) Community</tspan>, which is recognized as a Backward Class under:</text>
    <text x="80" y="440" font-size="12" fill="#555">Resolution No. 12011/68/93-BCC(C) dated 10/09/1993, published in the Gazette of India</text>
    <text x="80" y="460" font-size="12" fill="#555">Extraordinary Part I Section I and State Government of Tamil Nadu BC/MBC Gazette.</text>

    <text x="80" y="510">It is also certified that she does NOT belong to the persons/sections (<tspan font-weight="bold">Creamy Layer</tspan>) mentioned in</text>
    <text x="60" y="535">Column 3 of the Schedule to the Government of India, Department of Personnel &amp; Training</text>
    <text x="60" y="560">O.M. No. 36012/22/93-Estt.(SCT) dated 08/09/1993, modified vide OM dated 13/09/2017.</text>
  </g>

  <!-- Quota Status Box -->
  <rect x="60" y="600" width="680" height="90" fill="#f9f5ff" rx="8" stroke="#712ae2" stroke-width="1.2"/>
  <text x="85" y="630" font-size="12" font-weight="bold" fill="#712ae2">OFFICIAL RESERVATION ENTITLEMENT</text>
  <text x="85" y="655" font-size="14" font-weight="bold" fill="#131b2e">Declared Category: <tspan fill="#712ae2">OBC - Non Creamy Layer (OBC-NCL)</tspan></text>
  <text x="85" y="675" font-size="12" fill="#555">Applicable for Central Universities, IITs, NITs, and National Merit Scholarship Portals</text>
  <text x="540" y="655" font-size="12" font-weight="bold" fill="#008855">VALIDITY: PERMANENT</text>

  <!-- Digital Signature & Seal -->
  <g transform="translate(100, 760)">
    <!-- Stamp -->
    <circle cx="45" cy="45" r="42" fill="none" stroke="#712ae2" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="45" y="40" fill="#712ae2" font-size="9" font-weight="bold" text-anchor="middle">GOVT OF TAMIL NADU</text>
    <text x="45" y="55" fill="#712ae2" font-size="8" text-anchor="middle">TAHSILDAR SEAL</text>
  </g>

  <g transform="translate(460, 780)">
    <text font-size="12" font-weight="bold" fill="#2c1452">Digitally Signed by Revenue Authority</text>
    <text y="20" font-size="11" fill="#555">R. Shanmugasundaram, B.Sc., B.L.</text>
    <text y="36" font-size="10" fill="#555">Tahsildar / Head of Revenue Division</text>
    <text y="54" font-size="10" font-family="monospace" fill="#712ae2">Ref Token: PKI-COMM-TN-2026-99214</text>
    <text y="70" font-size="10" fill="#008855" font-weight="bold">✓ Authenticated via DigiLocker Repository</text>
  </g>

  <!-- Footer -->
  <text x="400" y="975" font-size="10" fill="#888" text-anchor="middle">Under Section 7 of Aadhaar Act, this certificate is mapped to tokenized UIDAI identity.</text>
</svg>