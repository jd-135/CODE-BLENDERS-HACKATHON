<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="800" height="700" style="background:#fff;font-family:'Segoe UI',Roboto,sans-serif;">
  <rect width="800" height="700" fill="#f8faff"/>
  <!-- Passbook Border -->
  <rect x="25" y="25" width="750" height="650" fill="#ffffff" stroke="#2563eb" stroke-width="2" rx="12"/>
  <rect x="35" y="35" width="730" height="630" fill="none" stroke="#dbe4ff" stroke-width="1.5" rx="8"/>

  <!-- Bank Header -->
  <g transform="translate(60, 60)">
    <rect width="45" height="45" rx="8" fill="#2563eb"/>
    <text x="22" y="30" font-size="22" fill="#fff" font-weight="bold" text-anchor="middle">SBI</text>
    <text x="60" y="24" font-size="22" font-weight="bold" fill="#131b2e">STATE BANK OF INDIA</text>
    <text x="60" y="42" font-size="11" font-weight="600" fill="#2563eb">SAVINGS BANK PASSBOOK • DIRECT BENEFIT TRANSFER (DBT) MANDATE</text>
  </g>

  <rect x="520" y="55" width="220" height="50" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
  <text x="535" y="76" font-size="11" font-weight="bold" fill="#065f46">NPCI AADHAAR DBT SEEDING:</text>
  <text x="535" y="94" font-size="13" font-weight="bold" fill="#059669">ACTIVE &amp; VERIFIED</text>

  <line x1="50" y1="125" x2="750" y2="125" stroke="#2563eb" stroke-width="1.5"/>

  <!-- Account Data Grid -->
  <g transform="translate(60, 150)" font-size="13">
    <rect width="680" height="220" fill="#f9fafb" rx="8" stroke="#e5e7eb"/>

    <text x="20" y="35" fill="#6b7280" font-size="11" font-weight="bold">ACCOUNT HOLDER NAME:</text>
    <text x="20" y="58" fill="#111827" font-size="16" font-weight="bold">MS. PRIYA SHARMA</text>

    <text x="360" y="35" fill="#6b7280" font-size="11" font-weight="bold">ACCOUNT NUMBER:</text>
    <text x="360" y="58" fill="#2563eb" font-size="16" font-weight="bold" font-family="monospace">XXXX-XXXX-4819</text>

    <text x="20" y="100" fill="#6b7280" font-size="11" font-weight="bold">IFSC CODE:</text>
    <text x="20" y="120" fill="#111827" font-weight="bold" font-family="monospace">SBIN0001423</text>

    <text x="360" y="100" fill="#6b7280" font-size="11" font-weight="bold">BRANCH NAME:</text>
    <text x="360" y="120" fill="#111827" font-weight="bold">IIT Delhi Hauz Khas Branch (01423)</text>

    <text x="20" y="160" fill="#6b7280" font-size="11" font-weight="bold">MICR CODE:</text>
    <text x="20" y="180" fill="#111827" font-family="monospace">110002034</text>

    <text x="360" y="160" fill="#6b7280" font-size="11" font-weight="bold">ACCOUNT TYPE / CURRENCY:</text>
    <text x="360" y="180" fill="#111827" font-weight="bold">Regular Savings Bank (Resident) / INR</text>
  </g>

  <!-- DBT Integration Box -->
  <g transform="translate(60, 395)">
    <rect width="680" height="130" fill="#eff6ff" rx="8" stroke="#bfdbfe" stroke-width="1.2"/>
    <text x="20" y="30" font-size="12" font-weight="bold" fill="#1e40af">DIRECT BENEFIT TRANSFER (PFMS / NPCI) STATUS</text>
    <text x="20" y="55" font-size="12" fill="#1f2937">Aadhaar Mapping: <tspan font-family="monospace" font-weight="bold">XXXX-XXXX-4819</tspan> is mapped to this account on the National NPCI Mapper.</text>
    <text x="20" y="78" font-size="12" fill="#1f2937">Public Financial Management System (PFMS) Beneficiary Code: <tspan font-family="monospace" font-weight="bold">PFMS-SBI-DEL-98421</tspan></text>
    <text x="20" y="102" font-size="12" fill="#059669" font-weight="bold">✓ Ready for instant zero-fee Direct Scholarship Grant Disbursal.</text>
  </g>

  <!-- Bank Stamp and Signatory -->
  <g transform="translate(160, 580)">
    <circle cx="30" cy="20" r="34" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="30" y="16" fill="#2563eb" font-size="8" font-weight="bold" text-anchor="middle">SBI IIT DELHI</text>
    <text x="30" y="28" fill="#2563eb" font-size="7" text-anchor="middle">BRANCH STAMP</text>
  </g>

  <g transform="translate(500, 570)">
    <text font-family="'Brush Script MT',cursive" font-size="28" fill="#1e40af">R. K. Narayanan</text>
    <line x1="-10" y1="5" x2="180" y2="5" stroke="#333" stroke-width="1"/>
    <text y="22" font-size="11" font-weight="bold" fill="#4b5563">Branch Manager / Officer Sign</text>
  </g>
</svg>